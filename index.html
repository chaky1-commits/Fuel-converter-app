<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fuel Converter</title>
<meta name="theme-color" content="#0d0f12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fuel Conv">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">

<style>
:root{
  --bg:#0d0f12; --panel:#171a1f; --line:#3a404a; --text:#eef1f5; --dim:#7d8693;
  --accent:#4da3ff; --key:#1f242b; --key2:#2a313a;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
#app{height:100%;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 16px 22px}
header h1{font-size:22px;font-weight:800;white-space:nowrap;margin:0;color:#3ddc84;letter-spacing:.03em}
#clear{background:var(--key);color:var(--text);border:1px solid var(--line);border-radius:8px;
  padding:6px 12px;font-size:13px}
main{flex:1;display:flex;flex-direction:column;gap:10px;padding:0 14px 10px;min-height:0;overflow-y:auto}
.col{display:flex;flex-direction:column;border:2px solid var(--line);border-radius:14px;padding:8px 10px 12px}
.col.fuel{flex:none}
.col.dens{flex:none}
h2{font-size:15px;font-weight:600;margin:4px 0 8px;color:var(--text)}
.row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.lab{width:84px;font-size:15px;font-weight:600;flex:none;white-space:nowrap}
.box{flex:0 1 136px;min-width:0;height:42px;border:2px solid #fff;border-radius:6px;background:var(--panel);
  display:flex;align-items:center;justify-content:flex-end;padding:0 8px;font-size:19px;
  font-variant-numeric:tabular-nums;overflow:hidden;white-space:nowrap}
.box.active{border-color:var(--accent);box-shadow:0 0 0 2px rgba(77,163,255,.25)}
.box.active.typing::after{content:"";width:2px;height:24px;background:var(--accent);margin-left:2px;animation:blink 1s steps(1) infinite}
.box.calc{color:var(--text)}
@keyframes blink{50%{opacity:0}}
.mx{font-size:15px;font-weight:600;color:#fff;flex:none;width:94px;white-space:nowrap}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 14px;
  padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));background:#0a0c0f;border-top:1px solid #20252c}
.pad button{height:54px;font-size:24px;border:0;border-radius:12px;background:var(--key);color:var(--text)}
.pad button:active{background:var(--key2)}
.pad .fn{background:#262c34;font-size:20px}
</style>
</head>
<body>
<div id="app">
  <header><h1>FUEL CONVERTER</h1><button id="clear">Clear</button></header>
  <main>
    <div class="col fuel">
      <h2>Fuel Quantity</h2>
      <div class="row"><span class="lab">USG</span><div class="box" id="usg"></div><span class="mx">× 3.78541</span></div>
      
      <div class="row"><span class="lab" style="color:#3ddc84">Liter</span><div class="box" id="l"></div><span class="mx">× Density</span></div>
      
      <div class="row"><span class="lab">Kg</span><div class="box" id="kg"></div><span class="mx">× 2.20462</span></div>
      
      <div class="row"><span class="lab">lbs</span><div class="box" id="lbs"></div><span class="mx"></span></div>
    </div>
    <div class="col dens">
      <h2>Density</h2>
      <div class="row"><span class="lab" style="color:#3ddc84">Kg/L</span><div class="box" id="kgl"></div><span class="mx">× 8.3454</span></div>
      
      <div class="row"><span class="lab">lbs/USG</span><div class="box" id="lbsusg"></div><span class="mx"></span></div>
    </div>
  </main>
  <div class="pad" id="pad"></div>
</div>
<script>
const USG_L = 3.78541, KG_LBS = 2.20462, DENS_F = 8.3454;
const qtyIds = ['usg','l','kg','lbs'], denIds = ['kgl','lbsusg'];
let st = { active:'usg', fresh:true, src:'usg', qv:'', dsrc:'kgl', dv:'0.800' };

function num(s){ const n = parseFloat(s); return isNaN(n) ? null : n; }
function fmt(n, dp){ return n.toLocaleString('en-US',{maximumFractionDigits:dp}); }

function compute(){
  const out = {};
  const dIn = num(st.dv);
  let d = dIn === null ? null : (st.dsrc === 'kgl' ? dIn : dIn / DENS_F);
  if (d !== null && d <= 0) d = null;
  out.kgl = d; out.lbsusg = d === null ? null : d * DENS_F;
  const q = num(st.qv);
  let L = null;
  if (q !== null){
    if (st.src === 'usg') L = q * USG_L;
    else if (st.src === 'l') L = q;
    else if (d !== null) L = (st.src === 'kg' ? q : q / KG_LBS) / d;
  }
  out.l = L; out.usg = L === null ? null : L / USG_L;
  out.kg = (L !== null && d !== null) ? L * d : (st.src === 'kg' ? q : st.src === 'lbs' && q !== null ? q / KG_LBS : null);
  out.lbs = out.kg === null ? null : out.kg * KG_LBS;
  return out;
}

function render(){
  const o = compute();
  [...qtyIds, ...denIds].forEach(id=>{
    const el = document.getElementById(id);
    const isDen = denIds.includes(id);
    const isSrc = isDen ? st.dsrc === id : st.src === id;
    let txt = '';
    if (isSrc) txt = isDen ? st.dv : st.qv;
    else if (o[id] !== null && o[id] !== undefined) txt = fmt(o[id], isDen ? 4 : 2);
    el.textContent = txt;
    el.className = 'box' + (st.active === id ? ' active typing' : '') + (isSrc ? '' : ' calc');
  });
}

function press(k){
  const id = st.active, isDen = denIds.includes(id);
  let s = isDen ? (st.dsrc === id ? st.dv : '') : (st.src === id ? st.qv : '');
  if (st.fresh && k !== '⌫') s = '';
  st.fresh = false;
  if (k === '⌫') s = s.slice(0,-1);
  else if (k === '.') { if (!s.includes('.')) s = (s === '' ? '0' : s) + '.'; }
  else { if (s.length < 10) s = (s === '0') ? k : s + k; }
  if (isDen){ st.dsrc = id; st.dv = s; } else { st.src = id; st.qv = s; }
  render();
}

document.querySelectorAll('.box').forEach(el=>{
  el.addEventListener('click',()=>{ st.active = el.id; st.fresh = true; render(); });
});
const pad = document.getElementById('pad');
['7','8','9','4','5','6','1','2','3','.','0','⌫'].forEach(k=>{
  const b = document.createElement('button');
  b.textContent = k;
  if (k === '⌫' || k === '.') b.className = 'fn';
  b.addEventListener('click',()=>press(k));
  pad.appendChild(b);
});
document.getElementById('clear').addEventListener('click',()=>{
  st = { active:'usg', fresh:true, src:'usg', qv:'', dsrc:'kgl', dv:'0.800' }; render();
});
render();
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
</script>
</body>
</html>
